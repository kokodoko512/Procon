<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>再生画面</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>登録曲再生</h1>

  <!-- 再生中の曲タイトル -->
  <h2 id="now-playing" style="color:#333; margin-bottom:20px;">再生待機中</h2>

  <div id="song-list"></div>

  <button id="play-all-btn">全曲再生</button>

  <div id="player" style="margin-top:20px;"></div>

  <!-- 人狼当てへボタン（最初は非表示） -->
  <button id="next-btn" style="display:none; margin-top:20px;">人狼当てへ</button>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="js/play.js"></script>
</body>
</html>
