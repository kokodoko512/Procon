<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>市民の勝利！</title>
    <style>
      body {
        background: radial-gradient(circle at center, #0a0a1a 0%, #000000 100%);
        font-family: "Noto Sans JP", sans-serif;
        color: #e6f0ff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        animation: fadeIn 1.2s ease-in-out;
        position: relative;
        overflow: hidden;
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      h1 {
        font-size: 3rem;
        margin: 1rem 0 0.5rem 0;
        color: #4db8ff;
        text-shadow: 0 0 20px rgba(77, 184, 255, 0.6);
      }

      p {
        font-size: 1.3rem;
        margin-bottom: 2rem;
        color: #cce6ff;
        text-shadow: 0 0 10px rgba(77, 184, 255, 0.3);
      }

      table {
        width: 90%;
        max-width: 700px;
        margin: 0 auto 2rem auto;
        border-collapse: collapse;
        text-align: center;
        background-color: rgba(0, 0, 30, 0.6);
        overflow: hidden;
        box-shadow: 0 0 15px rgba(77, 184, 255, 0.4);
        table-layout: fixed;
      }

      th,
      td {
        border: 1px solid #4db8ff;
        padding: 12px;
        font-size: 0.7rem;
        color: #e6f0ff;
      }

      th:nth-child(1), td:nth-child(1) { width: 13%; }
      th:nth-child(2), td:nth-child(2) { width: 55%; }
      th:nth-child(3), td:nth-child(3) { width: 20%; }
      th:nth-child(4), td:nth-child(4) { width: 12%; }
 
      th {
        background-color: rgba(0, 102, 204, 0.6);
        color: #fff;
      }

      
      tbody tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.4);
      }

      tbody tr:hover {
        background-color: rgba(77, 184, 255, 0.05);
      }

      .btn {
        background-color: #007acc;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 0.8rem 2rem;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 0 15px rgba(77, 184, 255, 0.5);
        margin-bottom: 2rem;
      }

      .btn:hover {
        background-color: #0066b2;
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(77, 184, 255, 0.8);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* 📱 スマホ向け調整 */
      @media screen and (max-width: 600px) {
        table {
          width: 95%;
          font-size: 0.85rem;
          margin: 1rem auto;
        }

        th,
        td {
          padding: 0.5px;
          white-space: normal;
          overflow-wrap: anywhere;
        }

        th:nth-child(1),
        td:nth-child(1) { width: 18%; }  /* プレイヤー名 少し広く */
        th:nth-child(2),
        td:nth-child(2) { width: 47%; }  /* 曲名 少し短め */
        th:nth-child(3),
        td:nth-child(3) { width: 23%; }  /* テーマ */
        th:nth-child(4),
        td:nth-child(4) { width: 12%; }  /* 人狼 */

        h1 {
          font-size: 3rem;
        }

        p {
          font-size: 1.2rem;
          line-height: 1.6;
        }

        .btn {
          padding: 0.6rem 1.5rem;
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>市民の勝利！</h1>
    <p>見事に人狼を見破りました！</p>

    <table>
      <thead>
        <tr>
          <th>プレイヤー名</th>
          <th>選んだ曲名</th>
          <th>テーマ</th>
          <th>人狼</th>
        </tr>
      </thead>
      <tbody id="players-result">
        <!-- result.jsで動的に生成 -->
      </tbody>
    </table>

    <button class="btn" onclick="restartGame()">もう一度プレイする</button>

    <script src="js/result.js"></script>
  </body>
</html>
