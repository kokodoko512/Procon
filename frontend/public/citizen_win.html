<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>市民の勝利！</title>
    <style>
      body {
        background-color: #5b5b5b;
        font-family: "Noto Sans JP", sans-serif;
        color: #e6f0ff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        animation: fadeIn 1.2s ease-in-out;
        position: relative;
        overflow: hidden;
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      h1 {
        margin: 50px 0 20px;
        font-size: 2rem;
        color: rgb(186, 240, 255);
        text-shadow: 0 0 12px rgba(50, 161, 202, 0.947);
      }

      p {
        font-size: 1.3rem;
        margin-bottom: 2rem;
        color: #cce6ff;
        text-shadow: 0 0 10px rgba(77, 184, 255, 0.3);
      }

      table {
        width: 90%;
        max-width: 700px;
        margin: 0 auto 2rem auto;
        border-collapse: collapse;
        text-align: center;
        background-color: rgb(98, 98, 98);
        overflow: hidden;
        box-shadow: 0 0 15px rgba(194, 231, 255, 0.65);
        table-layout: fixed;
      }

      th,
      td {
        padding: 12px;
        font-size: 0.7rem;
        color: #e6f0ff;
      }

      th:nth-child(1), td:nth-child(1) { width: 13%; }
      th:nth-child(2), td:nth-child(2) { width: 55%; }
      th:nth-child(3), td:nth-child(3) { width: 20%; }
      th:nth-child(4), td:nth-child(4) { width: 12%; }

      th {
        background-color: rgb(85, 183, 255);
        color: #fff;
      }

      
      tbody tr {
        background-color: rgba(255, 255, 255, 0.4);
      }

      tbody tr:hover {
        background-color: rgba(86, 86, 86, 0.6);
      }

      .btn {
        width: 204px;
        height: 52px;
        margin-top: 20px;
        background-image: url("img/restart.png");
        background-size: cover;
        background-repeat: no-repeat;
        background-color: transparent;
        border: none;
        cursor: pointer;
        filter: drop-shadow(0 0 12px rgba(67, 151, 236, 0.607));
        transition: all 0.3s ease;
      }

      .btn:hover {
        transform: translateY(-3px);
        filter: drop-shadow(0 0 18px rgba(117, 216, 255, 0.8));
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* スマホ向け調整 */
      @media screen and (max-width: 600px) {
        table {
          width: 95%;
          font-size: 0.85rem;
          margin: 1rem auto;
        }

        th,
        td {
          padding: 2px;
          white-space: normal;
          overflow-wrap: anywhere;
        }

        th:nth-child(1),
        td:nth-child(1) { width: 18%; }  /* プレイヤー名 少し広く */
        th:nth-child(2),
        td:nth-child(2) { width: 47%; }  /* 曲名 少し短め */
        th:nth-child(3),
        td:nth-child(3) { width: 23%; }  /* テーマ */
        th:nth-child(4),
        td:nth-child(4) { width: 12%; }  /* 人狼 */

        h1 {
          font-size: 3rem;
        }

        p {
          font-size: 1.2rem;
          line-height: 1.6;
        }
      }
    </style>
  </head>
  <body>
    <h1>市民の勝利！</h1>
    <p>見事に人狼を見破りました！</p>

    <table>
      <thead>
        <tr>
          <th>プレイヤー名</th>
          <th>選んだ曲名</th>
          <th>テーマ</th>
          <th>人狼</th>
        </tr>
      </thead>
      <tbody id="players-result">
        <!-- result.jsで動的に生成 -->
      </tbody>
    </table>

    <button class="btn" onclick="restartGame()"></button>

    <script src="js/result.js"></script>
  </body>
</html>
