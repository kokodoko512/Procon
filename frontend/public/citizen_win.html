<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>市民の勝利！</title>
  <style>
    body {
      background: radial-gradient(circle at center, #fefefe 0%, #a0e1a7 100%);
      font-family: "Noto Sans JP", sans-serif;
      color: #222;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      animation: fadeIn 1.2s ease-in-out;
    }

    .emoji {
      font-size: 5rem;
      margin-top: 2rem;
      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 3rem;
      margin: 1rem 0 0.5rem 0;
      color: #2c7a2c;
      text-shadow: 0 0 10px rgba(0, 128, 0, 0.3);
    }

    p {
      font-size: 1.3rem;
      margin-bottom: 2rem;
    }

    table {
      width: 90%;
      max-width: 700px;
      margin: 0 auto 2rem auto;
      border-collapse: collapse;
      text-align: center;
      background-color: rgba(0,0,0,0.1);
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,128,0,0.3);
    }

    th, td {
      border: 1px solid #2c7a2c;
      padding: 12px;
      font-size: 1rem;
      color: #222;
    }

    th {
      background-color: rgba(44,122,44,0.7);
      color: #fff;
    }

    tbody tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.05);
    }

    tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .btn {
      background-color: #2c7a2c;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0, 128, 0, 0.3);
      margin-bottom: 2rem;
    }

    .btn:hover {
      background-color: #256b25;
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="emoji">✨🎉🎊</div>
  <h1>市民の勝利！</h1>
  <p>見事に人狼を見破りました！</p>

  <table>
    <thead>
      <tr>
        <th>プレイヤー名</th>
        <th>選んだ曲名</th>
        <th>テーマ</th>
        <th>人狼</th>
      </tr>
    </thead>
    <tbody id="players-result">
      <!-- result.jsで動的に生成 -->
    </tbody>
  </table>

  <button class="btn" onclick="restartGame()">もう一度プレイする</button>

  <script src="result.js"></script>
</body>
</html>
